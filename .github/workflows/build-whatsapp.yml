name: Build externo da ponte WhatsApp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-whatsapp.yml'
      - 'Dockerfile.whatsapp'
      - 'scripts/whatsapp-*.mjs'
      - 'lib/whatsapp/**'
      - 'prisma/schema.prisma'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  imagem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compilar imagem da ponte
        run: |
          docker build --file Dockerfile.whatsapp --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "gyn-whatsapp:$GITHUB_SHA" .
      - name: Verificar a imagem
        run: |
          docker run --rm --network none --entrypoint node "gyn-whatsapp:$GITHUB_SHA" --check scripts/whatsapp-server.mjs
          docker run --rm --network none --entrypoint node "gyn-whatsapp:$GITHUB_SHA" --check scripts/whatsapp-mensagens.mjs
      - name: Empacotar imagem
        run: docker save "gyn-whatsapp:$GITHUB_SHA" | gzip -1 > gyn-whatsapp.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gyn-whatsapp-${{ github.sha }}
          path: gyn-whatsapp.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
